name: phase-module
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_baseline_release.py
      - run: python -m pytest tests/phase_module tests/test_locked_plugin_routes.py -q
      - run: arc-models validate
      - run: arc-models smoke
      - run: arc-phase design
      - run: arc-phase model-smoke
