[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-model"
version = "0.1.0"
readme = "README.md"
description = "Real-appliance series-arc detection: three audited baselines and shared phase features"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.8", "pandas>=2", "h5py>=3.10", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arc-phase = "arc_model.experiments.phase_cli:main"
arc-models = "arc_model.implementations.registry:main"
arc-project = "arc_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: prepared data and reference checkpoint tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/arc_model/vendor", "third_party", "data", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Historical research modules use compact one-line numerical code. New and
# refactored modules follow the normal formatter; these two legacy style rules
# are ignored until those modules are migrated behind parity tests.
ignore = ["E701", "E702", "E741"]
