# Nine independent model nodes; PILT-compatible parameter sections.
# Baseline nodes are release-locked; no anchors, merges or inherited defaults.
ArcFENet_Baseline:
  implementation: baseline_arc_fenet
  role: baseline
  backbone: arc_fenet
  parent_baseline_id: B_FENET_fixed20_v1
  parent_release: baselines_v1_20261030
  fidelity: conditional_reconstruction
  performance_status: locked_current_grouped_reference
  model_kwargs:
    extra: 0
    fusion: sum
    enhanced: true
    channels:
    - 16
    - 32
    - 64
    - 128
  model_training_param:
    optimizer: Adam
    lr: 0.001
    wd: 1.0e-05
    epochs: 20
    batch_size: 128
    seeds:
    - 0
    - 1
    - 2
    min_lr: 0.001
    scheduler: none
    threshold: 0.5
  input_contract:
    window_ms: 20
    reference: fixed20
    model_sample_rate_hz: 250000
    samples_per_cycle: 5000
    input_shape:
    - N
    - 3
    - 100
    - 100
    original_native_rates_hz:
    - 2000000
    - 1000000
    rectified: false
    phase_estimation_uses_signed_current: true
    preprocessing_fitted_on: outer_train_only
  feature_module:
    mode: none
    enabled_by_default: false
    feature_dim: 0
    lags: []
    hf_bands_hz: []
    phase_bins: 20
    auxiliary_branch: false
    requires_refit_on_frozen_parent: false
  precision:
    parameter_dtype: float32
    autocast: none
    matmul_tf32: false
    cudnn_tf32: false
    cudnn_deterministic: true
  evaluation:
    level: cycle
    primary: BAcc_condition
    metrics:
    - Accuracy
    - Precision
    - Recall
    - F1
    - Specificity
    - FPR
    - ROC_AUC
    - AP
    grouped_outer_folds: 5
    datasets:
    - continuous5m
    - zenodo5501527
    no_test_threshold_tuning: true
  source_note: Independent complete node; no YAML inheritance or implicit overrides
