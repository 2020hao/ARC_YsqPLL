specialized_study: locked_routes_20261030
datasets: [continuous5m, zenodo5501527]
models: [ArcFENet, HYDRA, ArcFusionNet]
parent_release: releases/baselines_v1_20261030
parent_registry: outputs/grouped_baseline_standard_20261029/baseline_registry.json
parent_identifiers:
  ArcFENet: B_FENET_fixed20_v1
  HYDRA: B_HYDRA_FD_fixed20_v1
  ArcFusionNet: B_FUSION_CURRENT_fixed20_v2
protocol:
  folds: 5
  seeds: [0]
  stage: matched_seed0_feasibility_not_multiseed_confirmation
  cohort: exact_reviewed_38374_and_1361
  split: frozen_condition_and_record_disjoint
  test_selection: forbidden
  reference: original_RCR_not_CFT
  invalid_reference: fixed20_input_fallback_without_dropping_windows
arms:
  baseline: frozen_weights_fixed20_input
  calibration_only: honest_inner_OOF_positive_affine_score_control
  dual_fixed20: frozen_parent_and_fixed20_dynamic36_score_branch
  dual_rcr: frozen_parent_and_RCR_dynamic36_score_branch
  single_direct: frozen_parent_weights_RCR_input_no_auxiliary_branch
  single_retrained: same_architecture_and_budget_retrained_on_RCR_input
dual:
  features: two_native_HF_bands_times_four_lags_times_four_statistics_plus_four_masks
  bands_hz: [[10000, 100000], [100000, 400000]]
  lags: [1, 2, 4, 8]
  statistics: [cosine, MAD, Jensen_Shannon, relative_peak_change]
  dimension: 36
  outer_frozen_backbone: true
  inner_group_folds: 2
  tuning: inner0_unseen_groups_split_for_head_fit_and_selection
  final_head_fit: all_outer_training_honest_inner_OOF
single:
  additional_branch: false
  additional_learned_parameters: 0
  trainable_backbone_same_budget: true
  direct_off_equals_frozen_baseline: required
  retrained_off_equals_frozen_baseline: false
evaluation:
  primary: condition_equally_weighted_cycle_BAcc
  secondary: [Accuracy, Precision, Recall, Specificity, F1, Macro_F1, FPR, FNR, ROC_AUC, AP, MCC, TP, FP, TN, FN]
  paired_bootstrap_unit: condition_or_public_appliance_file
  bootstrap_repetitions: 10000
  comparisons: [dual_rcr_vs_baseline, dual_rcr_vs_calibration_only, dual_rcr_vs_dual_fixed20, single_direct_vs_baseline, single_retrained_vs_baseline]
  multiplicity: Holm_per_comparison_family_across_six_dataset_model_cells
  reference_strata: [valid_pll, fixed20_fallback]
  evaluation_scope: exposed_outer_folds_exploratory
execution:
  physical_gpu_ids: [1, 2, 3]
  reserved_gpu_ids: [0]
  dual_gpu: 1
  single_gpus: [2, 3]
  preserve_training_budget: true
  reuse_verified_baseline_and_honest_inner_fits: true
output: outputs/locked_routes_20261030
