specialized_study: compact_attention_20261104
output: outputs/compact_attention_20261104
datasets:
- continuous5m
- zenodo5501527
pool_datasets: false
model: CompactHybrid_local_pooling
correction_branch: false
seeds:
- 0
- 1
- 2
outer_folds: 5
arms:
  average:
    coordinate: realtime
    encoding: continuous
    spiking: true
    decomposition: false
    architecture: hybrid
    pooling: average
  static:
    coordinate: realtime
    encoding: continuous
    spiking: true
    decomposition: false
    architecture: hybrid
    pooling: static
  content:
    coordinate: realtime
    encoding: continuous
    spiking: true
    decomposition: false
    architecture: hybrid
    pooling: content
input:
  source_profiles: native_rate_LF_mean_and_HF_10_100k_100_400k_power
  sample_rates_retained_hz:
  - 2000000
  - 1000000
  channels:
  - LF_mean
  - log_HF_low
  - log_HF_high
  - delta_distribution_low
  - delta_distribution_high
  - unused_zero
  - unused_zero
  - unused_zero
  decomposition_is_reversible_above_numerical_floor: false
  phase_bins: 64
  history_cycles: 9
  standardization: outer_training_current_cycles_only
  masks_reset_neurons: true
  no_test_labels_in_encoding: true
architecture:
  phase_bins: 64
  first_pooling: average4_or_local_softmax_weighted4
  second_pooling: average2
  feature_map_before_pool:
  - 24
  - 64
  score_parameters: 6
  static_score: sin_cos_harmonics_1_2_3_pointwise6to1
  content_score: channel_mean_max_circular_conv2to1_kernel3
  score_initialization: zeros; uniform local weights
  local_weight_normalization: softmax_in_each_nonoverlapping4bin_group
  temporal: 128to16_BN_then16LIF_9physicalcycles
  output: Linear16to1_of_last_membrane_over_threshold_plus_trace
  extra_classifier_branch: false
training:
  epochs: 50
  batch_size: 512
  optimizer: AdamW
  learning_rate: 0.001
  min_learning_rate: 1.0e-05
  weight_decay: 0.001
  loss: condition_and_class_equal_BCE
  spike_activity_penalty: 0.001
  checkpoint: fixed_final_epoch
  threshold: 0.5
  precision: FP32_all_layers_and_membranes
  gradient_clip: 1.0
  TF32: false
evaluation:
  primary: condition_equal_BAcc
  primary_pairs:
  - - content
    - static
  primary_Holm_family: 2
  secondary_pairs:
  - - content
    - average
  secondary_Holm_family: 2
  uncertainty_unit: condition_or_appliance_file
  cluster_bootstrap_repeats: 10000
  complexity:
  - parameters
  - bytes
  - convolution_linear_MAC
  - explicit_weighted_pool_MAC
  - non_MAC_ops
  - LIF_updates
  - CPU_GPU_B1_latency
  energy_scope: no_hardware_energy_claim_from_operation_counts
  runtime_scope: full_cycle_input_then_direct_prediction_CPU_FIFO
  historical_outer_exposure: exploratory_development
  adoption: require stable primary and average-reference gain in both datasets with
    acceptable FPR and measured cost; report all outcomes without test-selected variants
execution:
  physical_gpus:
  - 1
  - 2
  - 3
  exclude_gpu: 0
  timeout_seconds: 5400
  neural_fits: 60
  reused_reference_fits: 30
development_scope: user-authorized local pooling validation after prior360fits; exploratory
  on exposed outer groups, not independent confirmation
distillation: false
